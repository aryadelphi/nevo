slam_toolbox:
  ros__parameters:
    # Tuned 2026-10-14 for the RPLidar A1 (Sensitivity mode: ~7.6 Hz, 0.33 deg/beam,
    # 12 m max). Original kept at ~/mapper_params_online_async.yaml.bak_2026-10-14.

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    # was None: one wrong loop closure got full weight and bent the whole map.
    ceres_loss_function: HuberLoss

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan_filtered
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 5.0
    # was 0.02: finer than the A1 can resolve (speckled, double walls) and 6x the memory.
    resolution: 0.05
    min_laser_range: 0.0
    # was 20.0: the A1 tops out at 12 m and is noisy past ~10 m.
    max_laser_range: 10.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000
    # was true: only needed for manual graph editing in RViz; saves CPU/RAM on the Pi.
    enable_interactive_mode: false

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    # was 0.5 / 0.5 (~29 deg): more overlap between processed scans, especially in turns.
    minimum_travel_distance: 0.25
    minimum_travel_heading: 0.25
    # was 10: keeps the buffer at ~5 m of travel with the smaller travel step.
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    # was 0.35 / 0.45: stricter, a false closure ruins the map, a missed one only drifts.
    loop_match_minimum_response_coarse: 0.40
    loop_match_minimum_response_fine: 0.55

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    # was 0.1: drops ghost trails from people walking past. Too high erases thin legs.
    occupancy_threshold: 0.15
