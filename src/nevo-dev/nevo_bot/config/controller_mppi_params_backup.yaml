amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.10
    alpha2: 0.05
    alpha3: 0.10
    alpha4: 0.05
    alpha5: 0.0
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 11.5
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    scan_topic: /scan_filtered

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /diff_cont/odom
    bt_loop_duration: 20
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    wait_for_service_timeout: 5000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 5.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # --- MPPI Core Settings ---
      time_steps: 28          # sim_time (2.8s) = time_steps * model_dt
      model_dt: 0.1
      batch_size: 500
      iteration_count: 1
      
      # --- Motion Model (Differential Drive) ---
      motion_model: "DiffDrive"
      v_std: [0.1, 0.15]      # Noise for [linear, angular] velocity sampling
      v_mag_scaler: 0.25
    
      # --- 1. THE SPREAD (ADD THESE!) ---
      vx_std: 0.2             # Forward speed variance
      vy_std: 0.0             # Must be 0 for DiffDrive
      wz_std: 0.8             # INCREASED: Forces tentacles to fan out into a wide cone!
    
    # --- 2. THE SMOOTHING (ADD THESE!) ---
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.6        # INCREASED: Blends paths together to pull away from sharp edges
      gamma: 0.015

      # --- Robot Limits ---
      vx_max: 0.35
      vx_min: -0.15
      vy_max: 0.0
      wz_max: 0.72
      
      # --- Accel Limits (Maintaining your "Limousine" feel) ---
      ax_max: 0.02             # Slow start
      ax_min: -0.05            # Gentle braking
      az_max: 0.8             # Angular accel
      
      # --- Critics (Scoring Functions) ---
      critics: [
        "ConstraintCritic", 
        "GoalCritic", 
        "GoalAngleCritic", 
        "PathAlignCritic", 
        "PathFollowCritic", 
        "PathAngleCritic", 
        "ObstaclesCritic"
      ]
      
      ConstraintCritic.enabled: true
      ConstraintCritic.cost_weight: 8.0
      
      GoalCritic.enabled: true
      GoalCritic.cost_weight: 5.0
      GoalCritic.threshold_to_consider: 1.4
      
      GoalAngleCritic.enabled: true
      GoalAngleCritic.cost_weight: 3.0
      GoalAngleCritic.threshold_to_consider: 0.5
      
      PathAlignCritic.enabled: true
      PathAlignCritic.cost_weight: 5.0
      PathAlignCritic.offset_from_endpoint: 2
      
      PathFollowCritic.enabled: true
      PathFollowCritic.cost_weight: 6.0
      PathFollowCritic.offset_from_endpoint: 0
      
      PathAngleCritic.enabled: true
      PathAngleCritic.cost_weight: 2.0
      PathAngleCritic.offset_from_endpoint: 2
      
      ObstaclesCritic.enabled: true
      ObstaclesCritic.cost_weight: 25.0

      ObstaclesCritic.repulsion_weight: 5.0   # (Default is usually 1.5). This acts as a literal "force field" pushing the robot away from the light blue gradient.
      ObstaclesCritic.critical_weight: 20.0   # (Default is usually 20.0). The "panic" multiplier if the tentacles touch the dark blue zone right next to the pink.
    
      ObstaclesCritic.consider_footprint: true
      
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.1
      footprint: "[[-0.35, -0.30], [-0.35, 0.30], [0.35, 0.30], [0.35, -0.30]]"

      plugins: ["stvl_layer", "obstacle_layer", "inflation_layer"]

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        voxel_decay: 6.0
        decay_model: 0
        voxel_size: 0.15
        track_unknown_space: false
        observation_persistence: 0.0
        max_obstacle_height: 2.0
        min_obstacle_height: 0.10
        obstacle_max_range: 2.5
        obstacle_min_range: 0.5
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 2.0
        mapping_mode: false
        map_save_duration: 60.0
        update_footprint_enabled: true
        combination_method: 1
        observation_sources: depth_camera
        depth_camera:
          data_type: "PointCloud2"
          topic: /points
          sensor_frame: "camera_link_optical"
          marking: true
          clearing: true
          obstacle_max_range: 2.5
          obstacle_min_range: 0.5
          min_obstacle_height: 0.10
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          clear_after_reading: true
          enabled: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          obstacle_max_range: 2.5
          obstacle_min_range: 0.20
          raytrace_max_range: 3.0
          raytrace_min_range: 0.20

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.8 # Shrunk for better agility

      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      rolling_window: false
      footprint: "[[-0.35, -0.30], [-0.35, 0.30], [0.35, 0.30], [0.35, -0.30]]"

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          obstacle_max_range: 8.0
          obstacle_min_range: 0.20
          raytrace_max_range: 10.0
          raytrace_min_range: 0.20

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.5

      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
      ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_stamped_vel: False
    use_sim_time: False
    smoothing_frequency: 10.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    
    # Synced with DWB limits
    max_velocity: [0.35, 0.0, 0.72]
    min_velocity: [-0.15, 0.0, -0.72]
    
    # Synced with Limousine Accel/Decel
    max_accel: [0.1, 0.0, 0.8]       
    max_decel: [-0.2, 0.0, -1.0]     
    
    odom_topic: /diff_cont/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: False
    autostart: True
    bond_timeout: 15.0 
    node_names:
      [
        "controller_server",
        "smoother_server",
        "planner_server",
        "behavior_server",
        "bt_navigator",
        "waypoint_follower",
        "velocity_smoother",
      ]
