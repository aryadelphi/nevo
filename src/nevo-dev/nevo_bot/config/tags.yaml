apriltag:
  ros__parameters:
    image_transport: raw
    family: 36h11
    # Define the exact size of the printed tag's black square in meters
    size: 0.05
    
    # Optional: If you want to detect multiple specific tag IDs, you can define them here
    # tag_ids: [0, 1, 2]
    # tag_frames: [docking_station_1, docking_station_2, docking_station_3]
    # tag_sizes: [0.162, 0.162, 0.162]
