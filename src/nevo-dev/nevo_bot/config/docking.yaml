docking_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 50.0
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: true
    dock_prestaging_tolerance: 0.5

    # === ADD THIS BLOCK TO CHOKE THE SPEED ===
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.05
      v_linear_max: 0.1   # Reduced from 0.24 m/s for a slow, safe reverse
      v_angular_max: 0.3  # Keeps steering corrections gentle
    # ==========================================

    dock_plugins: ['nevo_charging_dock']
    nevo_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.01
      staging_x_offset: -0.9
      staging_yaw_offset: 3.14159
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_translation_x: -0.15
      external_detection_translation_y: 0.0
      external_detection_translation_z: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: 0.0
      external_detection_rotation_yaw: -1.57
      filter_coef: 0.1

    docks: ['home_dock']
    home_dock:
      type: 'nevo_charging_dock'
      frame: 'map'
      pose: [3.33746, 0.27856, 1.56219]
