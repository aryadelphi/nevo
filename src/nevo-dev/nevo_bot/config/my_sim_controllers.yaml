controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_cont:
  ros__parameters:
    publish_rate: 100.0
    base_frame_id: base_link

    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    
    wheel_separation: 0.52
    wheel_separation_multiplier: 1.0 
    wheel_radius: 0.0635
    wheel_radius_multiplier: 1.0 
    
    use_stamped_vel: false
    
    enable_odom_tf: true
    odom_frame_id: odom
    
    twist_covariance_diagonal: [0.2, 0.001, 1e6, 1e6, 1e6, 0.2]
    pose_covariance_diagonal: [0.2, 0.001, 1e6, 1e6, 1e6, 0.2]

    # --- ADD THESE LIMITS BELOW ---
    # Linear limits (Moving forward/backward)
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 0.5          # m/s
    linear.x.min_velocity: -0.5         # m/s
    linear.x.max_acceleration: 0.8      # m/s^2
    linear.x.min_acceleration: -0.8     # m/s^2

    # Angular limits (Turning)
    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 1.5         # rad/s
    angular.z.min_velocity: -1.5        # rad/s
    angular.z.max_acceleration: 1.5     # rad/s^2
    angular.z.min_acceleration: -1.5    # rad/s^2