ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    # base_link is ROOT of URDF (robot_core.xacro), base_footprint is its CHILD.
    # EKF publishes odom->base_link so the full tree becomes:
    #   map -> odom -> base_link (EKF) -> base_footprint / chassis / laser_frame / wheels (RSP)
    base_link_frame: base_link
    world_frame: odom

    # Wheel encoder odometry — velocity only (no pose drift accumulation)
    odom0: /diff_cont/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: true
    odom0_relative: true
    odom0_queue_size: 5

    # MPU6050 IMU — angular velocity only (gyro Z for yaw correction)
    # Linear acceleration NOT fused — gravity removal unreliable on tilted IMU,
    # and wheel odom already provides better velocity estimates.
    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 5

    # RF2O laser odometry — DISABLED for now
    # TODO: Will be replaced by wheel odom + IMU fusion in the future
    # When ready, uncomment odom1 and configure for IMU sensor
    # odom1: /odom_rf2o
    # odom1_config: [false, false, false,
    #                false, false, false,
    #                true,  false, false,
    #                false, false, true,
    #                false, false, false]
    # odom1_differential: false
    # odom1_relative: false
    # odom1_queue_size: 5


    # Process noise covariance (Q matrix)
